# CI (docs/TESTING.md "CI", WP-01): unit tests + coverage, desktop build + smoke test, Node tooling tests (WP-02), Switch build (.nro + .elf).
# WP-03b: the write-jail grep gate runs in the unit-test job (tools/build.sh tests), the .elf safety gate inside the Switch build,
# plus its self-test.
# WP-04: the GraphQL contract test runs in the Node job; the fuzz job runs each libFuzzer target for 60 s (SAFETY.md S6).
# Later WPs add integration and desktop E2E jobs. Device tests run on the owner's PC only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Unit tests + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7   # no submodules needed: the unit tests don't use borealis
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcovr
      # The contract test needs the Node packages; the node job runs it.
      - name: Unit tests
        run: tools/build.sh tests
        env:
          SNX_SKIP_CONTRACT: '1'
      - name: Unit tests, test-hooks build
        run: tools/build.sh tests --test-hooks
        env:
          SNX_SKIP_CONTRACT: '1'
      - name: Coverage
        run: tools/build.sh coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: tests/out/coverage/

  desktop:
    name: Desktop build + smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # library/borealis only; its glfw comes next (its SDL submodule isn't needed)
      - name: borealis's glfw
        run: git -C library/borealis submodule update --init --depth 1 library/lib/extern/glfw
      # dbus-x11: borealis asks the D-Bus session bus for a screensaver inhibitor at start-up and aborts inside libdbus when there
      # is no bus (it doesn't check for a failed connection). dbus-x11 starts a bus on demand, as on the PC.
      - name: Install build deps (docs/SETUP.md A.2) + Xvfb
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential cmake ninja-build pkg-config
          xorg-dev libdbus-1-dev libxkbcommon-dev libwayland-dev wayland-protocols libgl1-mesa-dev libgl1-mesa-dri
          xvfb imagemagick dbus-x11
      - name: Build
        run: tools/build.sh desktop
      - name: Smoke test (Xvfb)
        run: tools/desktop-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke
          path: ~/build/suwayomi-nx/desktop/smoke/

  node:
    name: Node tooling (fixtures, page code)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: GraphQL contract test (src/core/graphql against tests/fixtures/schema.graphql)
        run: npm run contract
      - name: Unit tests, including the whole fixture set generated twice (D31)
        run: npm test
        env:
          SNX_FULL_FIXTURES: '1'

  fuzz:
    name: Fuzz (libFuzzer + ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # clang 18 is Ubuntu 24.04's default; libclang-rt-18-dev holds libFuzzer and the sanitizer runtimes.
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang libclang-rt-18-dev
      - name: Fuzz every target for 60 s, starting from the recorded answers
        run: tools/build.sh fuzz 60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: tests/out/fuzz/

  switch:
    name: Switch build (.nro + .elf)
    runs-on: ubuntu-24.04
    # devkitPro's image, pinned by digest (tag 20260219), used as it is (D27). It already has every package we need, with the
    # same libnx/deko3d/portlib versions as the PC. No dkp-pacman updates: devkitPro's server refuses CI machines (HTTP 403) and
    # asks CI to use the images. Its compiler is one release older than the PC's (see the version step).
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Tools the checkout and the build need
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: borealis's glfw
        run: |
          git config --global --add safe.directory '*'
          git -C library/borealis submodule update --init --depth 1 library/lib/extern/glfw
      - name: devkitPro package versions (local query, no download)
        run: >
          dkp-pacman -Q devkitA64 devkita64-gcc libnx deko3d uam switch-tools switch-glfw switch-mesa switch-glm
          switch-curl switch-libwebp switch-libjpeg-turbo switch-libpng switch-zlib
      - name: Build (the safety gate runs inside it, D33)
        run: tools/build.sh switch
      - name: Safety gate self-test (a deliberately linked banned call must fail the build)
        run: tools/safety/gate-selftest.sh
      - uses: actions/upload-artifact@v7
        with:
          name: suwayomi-nx-switch
          path: |
            ~/build/suwayomi-nx/switch/suwayomi-nx.nro
            ~/build/suwayomi-nx/switch/suwayomi-nx.elf
            ~/build/suwayomi-nx/switch/safety-report.txt
