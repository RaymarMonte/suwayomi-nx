# Moves a category (WP-24). $position is 1-based among the categories after Default (0 is refused, past the end = the end).
# Answers every category in the new order.
mutation UpdateCategoryOrder($id: Int!, $position: Int!) {
  updateCategoryOrder(input: { id: $id, position: $position }) {
    categories { id name order default }
  }
}
